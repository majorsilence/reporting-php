name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ffi
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Lint src/
        run: find src -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run tests
        run: composer test

  native:
    name: PHP ${{ matrix.php }} / rdlnative ${{ matrix.channel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4']
        channel: [stable, prerelease]
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ffi
          ini-values: ffi.enable=true
          coverage: none
      - name: Install native dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libfontconfig1 libfreetype6
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Fetch rdlnative (${{ matrix.channel }})
        run: .github/scripts/fetch-rdlnative.sh ${{ matrix.channel }}
        env:
          GH_TOKEN: ${{ github.token }}
      # NOTE: do not set LD_LIBRARY_PATH to the rdlnative directory; with
      # rdlnative 27.0.0-alpha.11 it makes PHP segfault when opening SQLite.
      - name: Run native integration tests (fail if any are skipped)
        run: vendor/bin/phpunit --fail-on-skipped
